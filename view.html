<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ගබඩාව බලන්න</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #fff; margin: 0; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .header img { width: 100px; height: 100px; border-radius: 50%; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .item-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; text-align: center; }
        .item-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .price { color: #2563eb; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="content">
    <div class="header">
        <img id="logo" src="">
        <h1 id="name">Loading...</h1>
        <p id="desc"></p>
    </div>
    <div id="items" class="item-grid"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcmM1H6QGNa7qqb7RhQKH6evqCx_Jn1os",
        authDomain: "stores-padiyatalawa.firebaseapp.com",
        projectId: "stores-padiyatalawa",
        databaseURL: "https://stores-padiyatalawa-default-rtdb.firebaseio.com",
        storageBucket: "stores-padiyatalawa.firebasestorage.app",
        messagingSenderId: "724079651866",
        appId: "1:724079651866:web:c3e5d1899be414fc8875a3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // URL එකෙන් id එක ගන්නවා (e.g. view.html?id=123)
    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('id');

    if (storeId) {
        // ගබඩාවේ විස්තර ගන්නවා
        db.ref('approved_stores/' + storeId).on('value', snap => {
            const s = snap.val();
            if (s) {
                document.getElementById('name').innerText = s.storeName;
                document.getElementById('desc').innerText = s.description || "";
                document.getElementById('logo').src = s.logo || "https://via.placeholder.com/100";
            }
        });

        // බඩු ලැයිස්තුව ගන්නවා
        db.ref('store_data/' + storeId + '/categories').on('value', snap => {
            const itemDiv = document.getElementById('items');
            itemDiv.innerHTML = "";
            const cats = snap.val();
            for (let cId in cats) {
                const products = cats[cId].products;
                for (let pId in products) {
                    const p = products[pId];
                    itemDiv.innerHTML += `
                        <div class="item-card">
                            <img src="${p.image || 'https://via.placeholder.com/150'}">
                            <h4>${p.name}</h4>
                            <div class="price">Rs. ${p.currentDaily}</div>
                        </div>`;
                }
            }
        });
    } else {
        document.body.innerHTML = "<h1>Store ID එකක් නැත!</h1>";
    }
</script>
</body>
</html>
