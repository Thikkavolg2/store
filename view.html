<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer View - Padiyatalawa Prices</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .store-header { background: #1a73e8; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .store-logo { width: 60px; height: 60px; border-radius: 50%; background: white; margin-bottom: 10px; }
        .item-card { background: white; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .price-tag { color: #27ae60; font-weight: bold; font-size: 1.1rem; }
        .call-btn { display: inline-block; background: #27ae60; color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="contentArea"></div>

<script>
    const firebaseConfig = { /* ... ඔබේ config එක ... */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('approved_stores').on('value', storesSnap => {
        const area = document.getElementById('contentArea');
        area.innerHTML = "";
        
        storesSnap.forEach(sSnap => {
            const store = sSnap.val();
            const sid = sSnap.key;
            
            let html = `
                <div class="store-header">
                    ${store.logo ? `<img src="${store.logo}" class="store-logo">` : ''}
                    <h2>${store.storeName}</h2>
                    <p>${store.description || ''}</p>
                    ${store.phone ? `<a href="tel:${store.phone}" class="call-btn">📞 Call: ${store.phone}</a>` : ''}
                </div>
            `;

            db.ref('store_data/' + sid + '/categories').once('value', catSnap => {
                catSnap.forEach(c => {
                    const products = c.val().products;
                    if(products) {
                        Object.values(products).forEach(p => {
                            html += `
                                <div class="item-card">
                                    <span><strong>${p.name}</strong></span>
                                    <span class="price-tag">Rs. ${p.currentDaily}</span>
                                </div>`;
                        });
                    }
                });
                area.innerHTML += html;
            });
        });
    });
</script>
</body>
</html>
