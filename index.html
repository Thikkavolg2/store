<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Registration - Google Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reg-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .google-btn { width: 100%; padding: 12px; background: #4285F4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="reg-card">
    <h2>වෙළඳසැල් ලියාපදිංචිය</h2>
    <input type="text" id="storeName" placeholder="වෙළඳසැලේ නම">
    <input type="tel" id="ownerPhone" placeholder="දුරකථන අංකය">
    <p style="font-size: 0.8rem; color: #666;">තහවුරු කිරීම සඳහා ඔබේ Google ගිණුමෙන් ලොග් වන්න</p>
    <button class="google-btn" onclick="signUpWithGoogle()">Google හරහා ලියාපදිංචි වන්න</button>
    <div id="msg"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcmM1H6QGNa7qqb7RhQKH6evqCx_Jn1os",
        authDomain: "stores-padiyatalawa.firebaseapp.com",
        projectId: "stores-padiyatalawa",
        databaseURL: "https://stores-padiyatalawa-default-rtdb.firebaseio.com",
        storageBucket: "stores-padiyatalawa.firebasestorage.app",
        messagingSenderId: "724079651866",
        appId: "1:724079651866:web:c3e5d1899be414fc8875a3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function signUpWithGoogle() {
        const store = document.getElementById('storeName').value;
        const phone = document.getElementById('ownerPhone').value;

        if(!store || !phone) { alert("කරුණාකර සියලු විස්තර පුරවන්න"); return; }

        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result) => {
            const user = result.user;
            db.ref('pending_stores/' + user.uid).set({
                ownerName: user.displayName,
                email: user.email,
                storeName: store,
                phone: phone,
                status: "pending",
                time: new Date().toLocaleString()
            }).then(() => {
                document.body.innerHTML = "<h2>සාර්ථකයි! ✅</h2><p>Admin ඔබව අනුමත කරන තෙක් රැඳී සිටින්න.</p>";
            });
        }).catch((error) => {
            alert("ගැටලුවක් පවතී: " + error.message);
        });
    }
</script>
</body>
</html>
