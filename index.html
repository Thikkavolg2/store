<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padiyatalawa Stores - Welcome</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .main-card { background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        h1 { color: #1a73e8; margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #5f6368; margin-bottom: 30px; }
        .btn-container { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; text-decoration: none; display: block; }
        .btn-reg { background: #27ae60; color: white; }
        .btn-login { background: #1a73e8; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 380px; position: relative; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div class="main-card">
    <h1>පදියතලාව Stores</h1>
    <p>අද දවසේ මිල ගණන් දැනගැනීමට සහ ඇතුළත් කිරීමට එක්වන්න.</p>
    
    <div class="btn-container">
        <button class="btn btn-reg" onclick="openModal('reg')">නව වෙළඳසැලක් ලියාපදිංචි කරන්න</button>
        
        <button class="btn btn-login" onclick="openModal('login')">දැනටමත් ලියාපදිංචි වී ඇත්නම් ඇතුළු වන්න</button>
    </div>
</div>

<div id="regModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('reg')">&times;</span>
        <h3>ලියාපදිංචිය</h3>
        <input type="text" id="regStoreName" placeholder="වෙළඳසැලේ නම">
        <input type="tel" id="regPhone" placeholder="දුරකථන අංකය">
        <button class="btn btn-reg" onclick="handleAuth('reg')">Google හරහා ලියාපදිංචි වන්න</button>
    </div>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('login')">&times;</span>
        <h3>ඇතුළු වන්න (Sign In)</h3>
        <p style="font-size: 0.9rem;">ඔබේ අනුමත Google ගිණුමෙන් ලොග් වන්න</p>
        <button class="btn btn-login" onclick="handleAuth('login')">Google හරහා ඇතුළු වන්න</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcmM1H6QGNa7qqb7RhQKH6evqCx_Jn1os",
        authDomain: "stores-padiyatalawa.firebaseapp.com",
        projectId: "stores-padiyatalawa",
        databaseURL: "https://stores-padiyatalawa-default-rtdb.firebaseio.com",
        storageBucket: "stores-padiyatalawa.firebasestorage.app",
        messagingSenderId: "724079651866",
        appId: "1:724079651866:web:c3e5d1899be414fc8875a3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function openModal(type) { document.getElementById(type + 'Modal').style.display = 'flex'; }
    function closeModal(type) { document.getElementById(type + 'Modal').style.display = 'none'; }

    function handleAuth(mode) {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result) => {
            const user = result.user;
            
            if (mode === 'reg') {
                const sName = document.getElementById('regStoreName').value;
                const sPhone = document.getElementById('regPhone').value;
                if(!sName || !sPhone) { alert("කරුණාකර විස්තර පුරවන්න"); return; }
                
                db.ref('pending_stores/' + user.uid).set({
                    ownerName: user.displayName,
                    email: user.email,
                    storeName: sName,
                    phone: sPhone,
                    status: "pending"
                }).then(() => {
                    alert("ලියාපදිංචිය සාර්ථකයි! Admin අනුමත කරන තෙක් රැඳී සිටින්න.");
                    location.reload();
                });
            } else {
                // Sign In Mode - Check if approved
                db.ref('approved_stores/' + user.uid).once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        alert("සාදරයෙන් පිළිගනිමු " + snapshot.val().storeName);
                        // මෙතැනදී Dashboard එකට Redirect කළ හැකියි
                    } else {
                        alert("ඔබ තවමත් අනුමත වී නැත හෝ ලියාපදිංචි වී නැත.");
                        auth.signOut();
                    }
                });
            }
        }).catch(err => alert(err.message));
    }
</script>

</body>
</html>
