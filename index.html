<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Registration - Padiyatalawa</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .reg-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; font-size: 1.2rem; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #recaptcha-container { margin: 10px 0; }
        .message { margin-top: 15px; font-size: 0.9rem; text-align: center; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="reg-card">
    <h2>වෙළඳසැල් ලියාපදිංචිය</h2>
    <div id="step1">
        <input type="text" id="ownerName" placeholder="ඔබේ නම">
        <input type="text" id="storeName" placeholder="වෙළඳසැලේ නම">
        <input type="tel" id="phone" placeholder="+947XXXXXXXX (අංකය)">
        <div id="recaptcha-container"></div>
        <button onclick="sendOTP()">OTP ලබාගන්න</button>
    </div>
    <div id="step2" style="display:none;">
        <p>ලැබුණු OTP කේතය ඇතුළත් කරන්න:</p>
        <input type="number" id="otpCode" placeholder="######">
        <button onclick="verifyOTP()">තහවුරු කරන්න</button>
    </div>
    <div id="message" class="message"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcmM1H6QGNa7qqb7RhQKH6evqCx_Jn1os",
        authDomain: "stores-padiyatalawa.firebaseapp.com",
        projectId: "stores-padiyatalawa",
        databaseURL: "https://stores-padiyatalawa-default-rtdb.firebaseio.com",
        storageBucket: "stores-padiyatalawa.firebasestorage.app",
        messagingSenderId: "724079651866",
        appId: "1:724079651866:web:c3e5d1899be414fc8875a3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let confirmationResult;

    function sendOTP() {
        const phoneNumber = document.getElementById('phone').value;
        if(!phoneNumber.startsWith("+94")) { alert("අංකය +94 සමඟ පටන් ගන්න."); return; }
        
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container');
        auth.signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
            .then((result) => {
                confirmationResult = result;
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }).catch((err) => alert("වැරැද්දක්: " + err.message));
    }

    function verifyOTP() {
        const code = document.getElementById('otpCode').value;
        confirmationResult.confirm(code).then((result) => {
            const uid = result.user.uid;
            db.ref('pending_stores/' + uid).set({
                owner: document.getElementById('ownerName').value,
                store: document.getElementById('storeName').value,
                phone: document.getElementById('phone').value,
                status: "pending",
                time: new Date().toLocaleString()
            }).then(() => {
                document.body.innerHTML = "<h2>ලියාපදිංචිය සාර්ථකයි! ✅</h2><p>Admin ඔබව අනුමත කරන තෙක් රැඳී සිටින්න.</p>";
            });
        }).catch(() => alert("වැරදි OTP එකක්!"));
    }
</script>
</body>
</html>
