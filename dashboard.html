<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Merchant Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1a73e8; --success: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; }
        
        /* Profile Styling */
        .profile-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
        .store-title { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        .edit-input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; display: none; }
        
        /* Catalog Styling */
        .category-block { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 5px solid var(--primary); }
        .cat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        
        /* Product Styling */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #eee; padding: 12px; border-radius: 10px; background: #fff; }
        .prod-img-box { width: 100%; height: 100px; background: #eee; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
        .prod-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Toggle Visibility */
        .update-btn-group { display: none; }
        .view-mode { display: block; }
        .edit-mode { display: none; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-save { background: var(--success); color: white; }
        .btn-edit { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div id="authStatus" style="text-align:right; font-size:0.8rem; margin-bottom:10px;"></div>

    <div class="profile-card" id="profileSection">
        <img src="https://via.placeholder.com/80" id="storeLogo" class="profile-img">
        <input type="file" id="logoInp" style="display:none" onchange="uploadLogo()">
        <button class="btn btn-edit view-mode" onclick="document.getElementById('logoInp').click()">Change Logo</button>
        
        <h1 id="storeNameText" class="store-title view-mode">Store Name</h1>
        <input type="text" id="storeNameInp" class="edit-input edit-mode" placeholder="Store Name">
        
        <p id="storeDescText" class="view-mode">Description here</p>
        <textarea id="storeDescInp" class="edit-input edit-mode" placeholder="Description"></textarea>
        
        <p id="storePhoneText" class="view-mode">📞 000-0000000</p>
        <input type="text" id="storePhoneInp" class="edit-input edit-mode" placeholder="Phone Number">
        
        <div style="margin-top:10px;">
            <button id="profEditBtn" class="btn btn-edit view-mode" onclick="toggleProfileEdit(true)">Edit Profile</button>
            <button id="profSaveBtn" class="btn btn-save edit-mode" onclick="saveProfile()">Save Changes</button>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3>📦 භාණ්ඩ නාමාවලිය</h3>
        <button class="btn btn-edit" onclick="addCategory()">+ New Category</button>
    </div>
    <div id="catalogArea"></div>
</div>

<script>
    // Firebase Config මෙහි අලවන්න
    const firebaseConfig = { /* ... ඔබේ config එක ... */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    let currentUid = "";

    auth.onAuthStateChanged(user => {
        if (user) { currentUid = user.uid; loadData(); }
        else { window.location.href = "index.html"; }
    });

    function toggleProfileEdit(editing) {
        const views = document.querySelectorAll('#profileSection .view-mode');
        const edits = document.querySelectorAll('#profileSection .edit-mode');
        views.forEach(v => v.style.display = editing ? 'none' : 'block');
        edits.forEach(e => e.style.display = editing ? 'block' : 'none');
    }

    function saveProfile() {
        const data = {
            storeName: document.getElementById('storeNameInp').value,
            description: document.getElementById('storeDescInp').value,
            phone: document.getElementById('storePhoneInp').value
        };
        db.ref('approved_stores/' + currentUid).update(data).then(() => {
            toggleProfileEdit(false);
            alert("Profile Updated!");
        });
    }

    function loadData() {
        // Profile Load
        db.ref('approved_stores/' + currentUid).on('value', snap => {
            const d = snap.val();
            if(!d) return;
            document.getElementById('storeNameText').innerText = d.storeName;
            document.getElementById('storeNameInp').value = d.storeName;
            document.getElementById('storeDescText').innerText = d.description || "No description";
            document.getElementById('storeDescInp').value = d.description || "";
            document.getElementById('storePhoneText').innerText = "📞 " + (d.phone || "No phone");
            document.getElementById('storePhoneInp').value = d.phone || "";
            if(d.logo) document.getElementById('storeLogo').src = d.logo;
        });

        // Catalog Load
        db.ref('store_data/' + currentUid + '/categories').on('value', snap => {
            const area = document.getElementById('catalogArea');
            area.innerHTML = "";
            snap.forEach(catSnap => {
                const cat = catSnap.val();
                const catId = catSnap.key;
                let html = `
                    <div class="category-block">
                        <div class="cat-header">
                            <strong id="catName-${catId}">${cat.name}</strong>
                            <div>
                                <button class="btn btn-edit" onclick="editCategory('${catId}', '${cat.name}')"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-edit" onclick="addProduct('${catId}')">+ Add Product</button>
                            </div>
                        </div>
                        <div class="product-grid">`;
                
                if(cat.products) {
                    Object.keys(cat.products).forEach(pId => {
                        const p = cat.products[pId];
                        html += `
                            <div class="product-card">
                                <div class="prod-img-box"><img src="${p.image || ''}"></div>
                                <strong>${p.name}</strong>
                                <div id="view-${pId}">
                                    <p style="font-size:0.8rem">Daily: Rs.${p.currentDaily}</p>
                                    <button class="btn btn-edit" onclick="toggleProductEdit('${pId}', true)">Edit Price</button>
                                </div>
                                <div id="edit-${pId}" style="display:none">
                                    <input type="number" id="inp-d-${pId}" value="${p.currentDaily}" style="width:80px">
                                    <button class="btn btn-save" onclick="updatePrice('${catId}','${pId}')">Update</button>
                                </div>
                            </div>`;
                    });
                }
                html += `</div></div>`;
                area.innerHTML += html;
            });
        });
    }

    function toggleProductEdit(pId, editing) {
        document.getElementById('view-'+pId).style.display = editing ? 'none' : 'block';
        document.getElementById('edit-'+pId).style.display = editing ? 'block' : 'none';
    }

    function updatePrice(catId, pId) {
        const newVal = document.getElementById('inp-d-'+pId).value;
        db.ref(`store_data/${currentUid}/categories/${catId}/products/${pId}`).update({
            currentDaily: newVal,
            lastUpdated: new Date().toLocaleString()
        }).then(() => toggleProductEdit(pId, false));
    }

    function editCategory(id, oldName) {
        const newName = prompt("නව කාණ්ඩ නාමය ඇතුළත් කරන්න:", oldName);
        if(newName) db.ref(`store_data/${currentUid}/categories/${id}`).update({name: newName});
    }

    // (වෙනත් පහසුකම් - addProduct, addCategory ආදිය කලින් එවූ ඒවාම භාවිතා කරන්න)
</script>
</body>
</html>
