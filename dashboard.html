<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard - Padiyatalawa</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1a73e8; --secondary: #f39c12; --danger: #e74c3c; --success: #27ae60; --bg: #f4f6f8; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; }
        
        /* Profile Section */
        .profile-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; margin-bottom: 25px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
        .store-name-input { font-size: 1.8rem; font-weight: 800; border: none; text-align: center; width: 100%; color: #2c3e50; outline: none; border-bottom: 2px solid transparent; }
        .store-name-input:focus { border-bottom-color: var(--primary); }
        .desc-box { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; resize: none; font-family: inherit; }

        /* Product Cards */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .product-card { border-radius: 10px; padding: 12px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .prod-img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: #eee; }
        .prod-name { font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        
        .price-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .price-inputs label { font-size: 0.7rem; color: #777; font-weight: bold; }
        .price-inputs input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        
        .btn { padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 0.8rem; }
        .btn-update { background: var(--success); display: none; width: 100%; margin-bottom: 5px; } /* Hidden by default */
        .btn-history { background: var(--secondary); color: #333; }
        .btn-chart { background: #17a2b8; }
        .btn-delete { background: var(--danger); }
        .action-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h4 style="margin:0; color:#888;">Merchant Admin</h4>
        <button class="btn" style="background:#555;" onclick="logout()">Logout</button>
    </div>

    <div class="profile-card">
        <div style="position:relative; width:100px; margin:auto;">
            <img src="https://via.placeholder.com/100" id="storeLogo" class="profile-img">
            <label for="logoUpload" style="position:absolute; bottom:0; right:0; background:var(--primary); color:white; padding:5px; border-radius:50%; cursor:pointer; font-size:12px;"><i class="fas fa-camera"></i></label>
            <input type="file" id="logoUpload" accept="image/*" style="display:none" onchange="uploadLogo()">
        </div>
        <input type="text" id="storeNameField" class="store-name-input" placeholder="Store Name">
        <textarea id="storeDesc" class="desc-box" placeholder="වෙළඳසැල ගැන විස්තරයක්..."></textarea>
        <button class="btn" style="background:var(--primary); margin-top:10px; width:100%;" onclick="saveProfile()">Save Changes</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="font-size:1.2rem; margin:0;">📦 My Inventory</h2>
        <button class="btn" style="background:var(--success);" onclick="openModal('categoryModal')">+ New Category</button>
    </div>

    <div id="catalogContainer"></div>
</div>

<div id="categoryModal" class="modal"><div class="modal-content">
    <span class="close-btn" onclick="closeModal('categoryModal')">&times;</span>
    <h3>Add Category</h3>
    <input type="text" id="newCatName" placeholder="Category Name" style="width:100%; padding:10px; margin-bottom:10px;">
    <button class="btn" style="background:var(--success); width:100%;" onclick="addCategory()">Add</button>
</div></div>

<div id="productModal" class="modal"><div class="modal-content">
    <span class="close-btn" onclick="closeModal('productModal')">&times;</span>
    <h3>Add Product</h3>
    <input type="hidden" id="targetCatId">
    <input type="text" id="prodName" placeholder="Name" style="width:100%; padding:8px; margin-bottom:5px;">
    <input type="file" id="prodImgFile" accept="image/*" style="margin-bottom:10px;">
    <button class="btn" style="background:var(--primary); width:100%;" onclick="addProduct()">Add Product</button>
</div></div>

<div id="chartModal" class="modal"><div class="modal-content">
    <span class="close-btn" onclick="closeModal('chartModal')">&times;</span>
    <h3 id="chartProdName" style="text-align:center;"></h3>
    <canvas id="priceChart"></canvas>
</div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcmM1H6QGNa7qqb7RhQKH6evqCx_Jn1os",
        authDomain: "stores-padiyatalawa.firebaseapp.com",
        projectId: "stores-padiyatalawa",
        databaseURL: "https://stores-padiyatalawa-default-rtdb.firebaseio.com",
        storageBucket: "stores-padiyatalawa.firebasestorage.app",
        messagingSenderId: "724079651866",
        appId: "1:724079651866:web:c3e5d1899be414fc8875a3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let currentUid = null;
    let myChartInstance = null;

    auth.onAuthStateChanged(user => {
        if (user) { currentUid = user.uid; loadProfile(); loadCatalog(); }
        else { window.location.href = "index.html"; }
    });

    function loadProfile() {
        db.ref('approved_stores/' + currentUid).on('value', snap => {
            const data = snap.val();
            if(data) {
                document.getElementById('storeNameField').value = data.storeName;
                document.getElementById('storeDesc').value = data.description || "";
                if(data.logo) document.getElementById('storeLogo').src = data.logo;
            }
        });
    }

    function saveProfile() {
        const name = document.getElementById('storeNameField').value;
        const desc = document.getElementById('storeDesc').value;
        db.ref('approved_stores/' + currentUid).update({ storeName: name, description: desc })
          .then(() => alert("Profile Saved!"));
    }

    function uploadLogo() {
        const file = document.getElementById('logoUpload').files[0];
        const reader = new FileReader();
        reader.onload = (e) => db.ref('approved_stores/' + currentUid).update({ logo: e.target.result });
        reader.readAsDataURL(file);
    }

    function loadCatalog() {
        db.ref('store_data/' + currentUid + '/categories').on('value', snap => {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = "";
            const categories = snap.val();
            if(!categories) return container.innerHTML = "<p>No categories yet.</p>";

            for(let catId in categories) {
                const cat = categories[catId];
                let html = `<div style="margin-bottom:20px; background:#eee; padding:10px; border-radius:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <b style="font-size:1.1rem;">${cat.name}</b>
                        <button class="btn" style="background:var(--primary); padding:4px 10px;" onclick="openProductModal('${catId}')">+ Add</button>
                    </div>
                    <div class="product-grid">`;

                if(cat.products) {
                    for(let prodId in cat.products) {
                        const p = cat.products[prodId];
                        html += `
                        <div class="product-card">
                            <img src="${p.image || 'https://via.placeholder.com/150'}" class="prod-img">
                            <div class="prod-name">${p.name}</div>
                            <div class="price-inputs">
                                <div><label>Daily</label><input type="number" id="d-${prodId}" value="${p.currentDaily || ''}" oninput="showBtn('${prodId}')"></div>
                                <div><label>Monthly</label><input type="number" id="m-${prodId}" value="${p.currentMonthly || ''}" oninput="showBtn('${prodId}')"></div>
                            </div>
                            <button class="btn btn-update" id="btn-${prodId}" onclick="updatePrice('${catId}','${prodId}','${p.name}')">Save Update</button>
                            <div class="action-row">
                                <button class="btn btn-history" title="History" onclick="viewHistory('${catId}','${prodId}')"><i class="fas fa-history"></i></button>
                                <button class="btn btn-chart" title="Chart" onclick="openChart('${catId}','${prodId}','${p.name}')"><i class="fas fa-chart-bar"></i></button>
                                <button class="btn btn-delete" title="Delete" onclick="deleteProduct('${catId}','${prodId}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                    }
                }
                html += `</div></div>`;
                container.innerHTML += html;
            }
        });
    }

    // Auto-hide logic
    function showBtn(id) { document.getElementById('btn-' + id).style.display = 'block'; }

    function updatePrice(catId, prodId, name) {
        const d = document.getElementById('d-' + prodId).value;
        const m = document.getElementById('m-' + prodId).value;
        const time = new Date().toLocaleString();
        const ref = db.ref(`store_data/${currentUid}/categories/${catId}/products/${prodId}`);
        
        ref.update({ currentDaily: d, currentMonthly: m, lastUpdated: time }).then(() => {
            ref.child('history').push({ date: time, daily: d, monthly: m });
            document.getElementById('btn-' + id).style.display = 'none'; // Hide after save
            alert(name + " updated!");
        });
    }

    // Modal Helpers
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openProductModal(id) { document.getElementById('targetCatId').value = id; openModal('productModal'); }

    function addCategory() {
        const n = document.getElementById('newCatName').value;
        db.ref('store_data/' + currentUid + '/categories').push({ name: n }).then(() => closeModal('categoryModal'));
    }

    function addProduct() {
        const catId = document.getElementById('targetCatId').value;
        const name = document.getElementById('prodName').value;
        const file = document.getElementById('prodImgFile').files[0];
        
        const save = (img) => {
            db.ref(`store_data/${currentUid}/categories/${catId}/products`).push({ name, image: img || "" });
            closeModal('productModal');
        };

        if(file) {
            const reader = new FileReader();
            reader.onload = (e) => save(e.target.result);
            reader.readAsDataURL(file);
        } else save(null);
    }

    function deleteProduct(c, p) { if(confirm("Delete?")) db.ref(`store_data/${currentUid}/categories/${c}/products/${p}`).remove(); }

    function openChart(catId, prodId, name) {
        document.getElementById('chartProdName').innerText = name;
        openModal('chartModal');
        db.ref(`store_data/${currentUid}/categories/${catId}/products/${prodId}/history`).limitToLast(10).once('value', snap => {
            const data = snap.val();
            const labels = [], daily = [];
            if(data) Object.values(data).forEach(r => { labels.push(r.date.split(',')[0]); daily.push(r.daily); });
            
            if(myChartInstance) myChartInstance.destroy();
            myChartInstance = new Chart(document.getElementById('priceChart'), {
                type: 'line',
                data: { labels, datasets: [{ label: 'Daily Price', data: daily, borderColor: '#1a73e8', fill: false }] }
            });
        });
    }

    function logout() { auth.signOut().then(() => window.location.href = "index.html"); }
</script>

</body>
</html>
